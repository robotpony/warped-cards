<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 70" width="50" height="70">
  <!-- Special joker, reach: frame, purple inset, JOKER and REACH, and the icon. Text is centred on x, y. -->
  <g id="frame">
    <rect width="50" height="70" rx="4.5" fill="#FDFCF8"/>
    <rect x="0.6" y="0.6" width="48.8" height="68.8" rx="3.9" fill="none" stroke="#D6D0C4" stroke-width="1.2"/>
  </g>
  <rect id="inset" x="4" y="4" width="42" height="62" rx="2.5" fill="none" stroke="#6A1B9A" stroke-opacity="0.5" stroke-width="1"/>
  <text id="top" x="25" y="9.5" text-anchor="middle" dominant-baseline="central" font-family="Saira Semi Condensed, sans-serif" font-weight="700" font-size="8" fill="#6A1B9A" letter-spacing="1">JOKER</text>
  <text id="bottom" x="25" y="61.5" text-anchor="middle" dominant-baseline="central" font-family="Saira Semi Condensed, sans-serif" font-weight="700" font-size="8" fill="#6A1B9A" letter-spacing="1">REACH</text>
  <g id="icon-reach">
    <rect x="10" y="24" width="17" height="24" rx="2" fill="none" stroke="#6A1B9A" stroke-width="2.4"/>
    <rect x="23" y="29" width="17" height="24" rx="2" fill="#FDFCF8"/>
    <rect x="23" y="29" width="17" height="24" rx="2" fill="none" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M31.5 35.5V46.5M26 41H37" fill="none" stroke="#E00000" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
