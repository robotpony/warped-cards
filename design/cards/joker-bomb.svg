<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 70" width="50" height="70">
  <!-- Special joker, bomb: frame, purple inset, JOKER and BOMB, and the icon. Text is centred on x, y. -->
  <g id="frame">
    <rect width="50" height="70" rx="4.5" fill="#FDFCF8"/>
    <rect x="0.6" y="0.6" width="48.8" height="68.8" rx="3.9" fill="none" stroke="#D6D0C4" stroke-width="1.2"/>
  </g>
  <rect id="inset" x="4" y="4" width="42" height="62" rx="2.5" fill="none" stroke="#6A1B9A" stroke-opacity="0.5" stroke-width="1"/>
  <text id="top" x="25" y="9.5" text-anchor="middle" dominant-baseline="central" font-family="Saira Semi Condensed, sans-serif" font-weight="700" font-size="8" fill="#6A1B9A" letter-spacing="1">JOKER</text>
  <text id="bottom" x="25" y="61.5" text-anchor="middle" dominant-baseline="central" font-family="Saira Semi Condensed, sans-serif" font-weight="700" font-size="8" fill="#6A1B9A" letter-spacing="1">BOMB</text>
  <g id="icon-bomb">
    <circle cx="23" cy="40" r="11" fill="#2B2A26"/>
    <rect x="27" y="25" width="6" height="5" rx="1" fill="#2B2A26" transform="rotate(35 30 27.5)"/>
    <path d="M32 25C34 21 37 20 40 21" fill="none" stroke="#7C6C48" stroke-width="1.4"/>
    <path d="M41 17L42.2 19.6L45 20L43 22L43.5 24.8L41 23.5L38.5 24.8L39 22L37 20L39.8 19.6Z" fill="#E00000"/>
    <circle cx="19" cy="36" r="2.4" fill="#FFFFFF" fill-opacity="0.35"/>
  </g>
</svg>
