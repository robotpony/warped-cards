<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 70" width="50" height="70">
  <!-- Special joker, key: frame, purple inset, JOKER and KEY, and the icon. Text is centred on x, y. -->
  <g id="frame">
    <rect width="50" height="70" rx="4.5" fill="#FDFCF8"/>
    <rect x="0.6" y="0.6" width="48.8" height="68.8" rx="3.9" fill="none" stroke="#D6D0C4" stroke-width="1.2"/>
  </g>
  <rect id="inset" x="4" y="4" width="42" height="62" rx="2.5" fill="none" stroke="#6A1B9A" stroke-opacity="0.5" stroke-width="1"/>
  <text id="top" x="25" y="9.5" text-anchor="middle" dominant-baseline="central" font-family="Saira Semi Condensed, sans-serif" font-weight="700" font-size="8" fill="#6A1B9A" letter-spacing="1">JOKER</text>
  <text id="bottom" x="25" y="61.5" text-anchor="middle" dominant-baseline="central" font-family="Saira Semi Condensed, sans-serif" font-weight="700" font-size="8" fill="#6A1B9A" letter-spacing="1">KEY</text>
  <g id="icon-key">
    <circle cx="25" cy="25" r="7.5" fill="#F2B705" stroke="#6A1B9A" stroke-width="3"/>
    <circle cx="25" cy="25" r="2.4" fill="#FDFCF8"/>
    <rect x="23.3" y="32" width="3.4" height="19" rx="1" fill="#6A1B9A"/>
    <rect x="26" y="42" width="6" height="3" rx="0.8" fill="#6A1B9A"/>
    <rect x="26" y="47" width="4.5" height="3" rx="0.8" fill="#6A1B9A"/>
  </g>
</svg>
