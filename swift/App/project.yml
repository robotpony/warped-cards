# Crib Maze apps (ARCHITECTURE.md › App targets). Generate with: xcodegen generate
name: CribMaze
options:
  bundleIdPrefix: ca.robotpony
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
packages:
  CribMazeEngine: { path: .. }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.12.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 7J49PFSP65
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Bruce Alderson. Built in Canada."
  configs:
    # Release builds are signed with Developer ID for notarizing (RELEASING.md); Debug stays ad hoc.
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      - Shared
      - path: ../../cribbage/minigames/config
        type: folder
        buildPhase: resources
    dependencies:
      - package: CribMazeEngine
        product: CribMaze
      - package: CribMazeEngine
        product: CribMazeBots
    postBuildScripts:
      - name: Build number from git
        basedOnDependencyAnalysis: false
        script: |
          n=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $n" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
targets:
  CribMazeBeta:
    templates: [App]
    sources: [Beta]
    settings:
      base:
        PRODUCT_NAME: "Noddy Yookerspiel"
        PRODUCT_BUNDLE_IDENTIFIER: ca.robotpony.cribmaze.beta
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BETA"
  CribMaze:
    templates: [App]
    sources: [Release]
    settings:
      base:
        PRODUCT_NAME: "Crib Maze"
        PRODUCT_BUNDLE_IDENTIFIER: ca.robotpony.cribmaze
